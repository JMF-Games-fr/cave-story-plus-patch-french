name: Build and release patch

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as a GitHub Release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Validate tag
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [ -z "$TAG" ]; then
            echo "No tag provided for release."
            exit 1
          fi
          echo "Release tag: $TAG"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Build Windows installer
        run: |
          makensis installer.nsi
          ls -l cspfrpatch.exe

      - name: Package Linux patch archive
        run: |
          cd patch
          zip -r ../cspfr-patch-linux.zip .
          cd ..
          ls -l cspfr-patch-linux.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            cspfrpatch.exe
            cspfr-patch-linux.zip
          generate_release_notes: true
          draft: false
          prerelease: false
