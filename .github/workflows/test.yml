name: Test build

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Build Windows installer
        run: |
          makensis installer.nsi
          ls -l cspfrpatch.exe

      - name: Package Linux patch archive
        run: |
          cd patch
          zip -r ../cspfr-patch-linux.zip .
          cd ..
          ls -l cspfr-patch-linux.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patch-build-artifacts
          path: |
            cspfrpatch.exe
            cspfr-patch-linux.zip
